name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build, verify, and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify tag matches VERSION
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid package version." }
          $expected = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION ($expected)."
          }
      - name: Install release and test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-release.txt -r requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Build release files
        shell: cmd
        run: build_release.bat
      - name: Smoke-test executable
        shell: pwsh
        run: ./scripts/smoke_test_release.ps1
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid package version." }
          $releaseDirectory = "release/PDFeditorAthome-v$version-windows-x64"
          gh release create $env:GITHUB_REF_NAME `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "PDFeditorAthome $env:GITHUB_REF_NAME" `
            --notes-file packaging/RELEASE_NOTES.md `
            --latest `
            "$releaseDirectory/PDFeditorAthome.exe" `
            "$releaseDirectory/SHA256SUMS.txt" `
            "$releaseDirectory.zip"
