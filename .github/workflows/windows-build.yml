name: Windows package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and smoke-test executable
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install release and test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-release.txt -r requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Build release files
        shell: cmd
        run: build_release.bat
      - name: Smoke-test executable
        shell: pwsh
        run: ./scripts/smoke_test_release.ps1
      - name: Upload tested package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PDFeditorAthome-v1.0.1-windows-x64
          path: |
            release/PDFeditorAthome-v1.0.1-windows-x64/PDFeditorAthome.exe
            release/PDFeditorAthome-v1.0.1-windows-x64/SHA256SUMS.txt
            release/PDFeditorAthome-v1.0.1-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
