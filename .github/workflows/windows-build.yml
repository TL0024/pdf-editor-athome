name: Windows package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and smoke-test executable
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install release and test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-release.txt -r requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Build release files
        shell: cmd
        run: build_release.bat
      - name: Smoke-test executable
        shell: pwsh
        run: ./scripts/smoke_test_release.ps1
      - name: Read package version
        id: package-version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid package version." }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Upload tested package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PDFeditorAthome-v${{ steps.package-version.outputs.version }}-windows-x64
          path: |
            release/PDFeditorAthome-v${{ steps.package-version.outputs.version }}-windows-x64/PDFeditorAthome.exe
            release/PDFeditorAthome-v${{ steps.package-version.outputs.version }}-windows-x64/SHA256SUMS.txt
            release/PDFeditorAthome-v${{ steps.package-version.outputs.version }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
